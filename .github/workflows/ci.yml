name: DOJO WALK CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dojo-walk-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install
      - name: TypeScript checks and Admin production build
        run: npm run check
      - name: Validate Customer Expo dependencies and config
        working-directory: apps/customer
        run: npx --yes expo-doctor
      - name: Validate Walker Expo dependencies and config
        working-directory: apps/walker
        run: npx --yes expo-doctor
